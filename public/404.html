<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineDream</title>
    <script>
      // HashRouter: redirect all 404s back to root; hash fragment is preserved by the browser
      var l = window.location;
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/CineDream-Web/' + l.hash);
    </script>
  </head>
  <body></body>
</html>
